# ==========================================
# SkyBook Backend - Application Configuration
# ==========================================

app.base.url=https://airplane-ticket-management.vercel.app

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=framework

