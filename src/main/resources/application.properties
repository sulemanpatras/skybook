# ==========================================
# DATABASE CONFIGURATION (Neon PostgreSQL)
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/skybook_db
spring.datasource.username=skybook_user
spring.datasource.password=skybook_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# spring.jpa.hibernate.ddl-auto=update
